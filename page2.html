<h2 class="sr-only">Interactive plot of Fig. 14.7 style zonal wind (U_M and U_E) as the equator-to-pole radiative equilibrium temperature gradient changes</h2>
<div style="display:flex;align-items:center;gap:12px;margin:0 0 4px;">
  <label style="font-size:14px;color:var(--text-secondary);white-space:nowrap;">Equator&ndash;pole gradient &Delta;&theta;</label>
  <input type="range" id="dtheta" min="20" max="90" step="1" value="50" style="flex:1;" />
  <span id="dtheta-out" style="font-size:14px;font-weight:500;min-width:52px;text-align:right;">50 K</span>
</div>
<div style="display:flex;gap:24px;flex-wrap:wrap;margin:8px 0 1rem;font-size:13px;color:var(--text-secondary);">
  <span>&vartheta;<sub>H</sub> = <b id="thetaH-out" style="color:var(--text-primary);font-weight:500;">&mdash;</b></span>
  <span>U<sub>E</sub> = <b id="UE-out" style="color:var(--text-primary);font-weight:500;">&mdash;</b> m/s</span>
  <span>U<sub>M</sub>(&vartheta;<sub>H</sub><sup>&minus;</sup>) = <b id="jump-out" style="color:var(--text-primary);font-weight:500;">&mdash;</b> m/s</span>
</div>
<div style="position:relative;width:100%;">
  <svg id="plot" viewBox="0 0 640 380" width="100%" style="display:block;"></svg>
</div>
<div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text-secondary);">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:14px;height:2px;background:#D85A30;display:inline-block;"></span>U<sub>M</sub> (angular-momentum-conserving, &vartheta;&lt;&vartheta;<sub>H</sub>)</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:14px;height:2px;background:#378ADD;display:inline-block;"></span>U<sub>E</sub> (radiative-equilibrium wind, constant)</span>
</div>
<script>
const theta0 = 300, Omega = 7.272e-5, g = 9.81, H = 10000, a = 6.371e6;
const slider = document.getElementById('dtheta');
const out = document.getElementById('dtheta-out');
const thetaHOut = document.getElementById('thetaH-out');
const UEOut = document.getElementById('UE-out');
const jumpOut = document.getElementById('jump-out');
const svg = document.getElementById('plot');

function render() {
  const dtheta = parseFloat(slider.value);
  out.textContent = dtheta.toFixed(0) + ' K';

  const YH = Math.sqrt(5 * dtheta * g * H / (3 * Omega * Omega * theta0));
  const latH = (YH / a) * (180 / Math.PI);
  const R = (g * H * dtheta) / (theta0 * Omega * Omega * a * a);
  const UE = Omega * a * R;
  const UM = (y) => Omega * y * y / a;
  const jump = UM(YH);

  thetaHOut.textContent = latH.toFixed(1) + '\u00b0';
  UEOut.textContent = UE.toFixed(1);
  jumpOut.textContent = jump.toFixed(1);

  const latMax = 30;
  const n = 140;
  let umax = 0;
  const ptsM = [];
  for (let i = 0; i <= n; i++) {
    const lat = latMax * i / n;
    if (lat > latH) break;
    const y = a * lat * Math.PI / 180;
    const u = UM(y);
    ptsM.push([lat, u]);
    umax = Math.max(umax, u);
  }
  // extend UM curve slightly past latH to show where it *would* continue (thin line, like original figure)
  const ptsMExt = [];
  for (let i = 0; i <= n; i++) {
    const lat = latMax * i / n;
    const y = a * lat * Math.PI / 180;
    const u = UM(y);
    ptsMExt.push([lat, u]);
    umax = Math.max(umax, u);
  }
  const yMax = Math.max(100, Math.ceil((Math.max(umax, UE) * 1.05) / 10) * 10);

  const pad = { l: 50, r: 16, t: 14, b: 34 };
  const w = 640, h = 380;
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const xScale = (lat) => pad.l + (lat / latMax) * plotW;
  const yScale = (u) => pad.t + plotH - (u / yMax) * plotH;

  const isDark = (document.documentElement.dataset.mode ? document.documentElement.dataset.mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  const gridColor = isDark ? '#2c2c2a' : '#e1e0d9';
  const axisColor = isDark ? '#383835' : '#c3c2b7';
  const tickColor = '#898781';

  let s = '';
  const yTickCount = 5;
  for (let i = 0; i <= yTickCount; i++) {
    const u = yMax * i / yTickCount;
    const yy = yScale(u);
    s += '<line x1="' + pad.l + '" y1="' + yy + '" x2="' + (w - pad.r) + '" y2="' + yy + '" stroke="' + gridColor + '" stroke-width="1"/>';
    s += '<text x="' + (pad.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="' + tickColor + '">' + u.toFixed(0) + '</text>';
  }
  const xTicks = [0, 5, 10, 15, 20, 25, 30];
  for (const lt of xTicks) {
    const xx = xScale(lt);
    s += '<text x="' + xx + '" y="' + (h - pad.b + 18) + '" text-anchor="middle" font-size="11" fill="' + tickColor + '">' + lt + '</text>';
  }
  s += '<text x="' + (pad.l - 36) + '" y="' + (pad.t + plotH / 2) + '" text-anchor="middle" font-size="12" fill="' + tickColor + '" transform="rotate(-90 ' + (pad.l - 36) + ' ' + (pad.t + plotH / 2) + ')">Zonal velocity (m/s)</text>';
  s += '<text x="' + (pad.l + plotW / 2) + '" y="' + (h - 4) + '" text-anchor="middle" font-size="12" fill="' + tickColor + '">Latitude</text>';
  s += '<line x1="' + pad.l + '" y1="' + (pad.t + plotH) + '" x2="' + (w - pad.r) + '" y2="' + (pad.t + plotH) + '" stroke="' + axisColor + '" stroke-width="1"/>';
  s += '<line x1="' + pad.l + '" y1="' + pad.t + '" x2="' + pad.l + '" y2="' + (pad.t + plotH) + '" stroke="' + axisColor + '" stroke-width="1"/>';

  // thin extended UM curve past latH (matches thin continuation in original fig)
  const thinPath = ptsMExt.map((p, i) => (i === 0 ? 'M' : 'L') + xScale(p[0]) + ' ' + yScale(Math.min(p[1], yMax * 1.3))).join(' ');
  s += '<path d="' + thinPath + '" fill="none" stroke="' + axisColor + '" stroke-width="1"/>';

  // U_E full horizontal line across whole range (thin), then thick from latH to 30
  s += '<line x1="' + pad.l + '" y1="' + yScale(UE) + '" x2="' + (w - pad.r) + '" y2="' + yScale(UE) + '" stroke="#378ADD" stroke-width="1" opacity="0.5"/>';
  s += '<line x1="' + xScale(latH) + '" y1="' + yScale(UE) + '" x2="' + xScale(latMax) + '" y2="' + yScale(UE) + '" stroke="#378ADD" stroke-width="3"/>';

  // thick U_M curve up to latH
  const thickPath = ptsM.map((p, i) => (i === 0 ? 'M' : 'L') + xScale(p[0]) + ' ' + yScale(p[1])).join(' ');
  s += '<path d="' + thickPath + '" fill="none" stroke="#D85A30" stroke-width="3"/>';

  // discontinuity jump at latH
  s += '<line x1="' + xScale(latH) + '" y1="' + yScale(jump) + '" x2="' + xScale(latH) + '" y2="' + yScale(UE) + '" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="2,3"/>';

  // vertical dashed marker for latH down to axis
  s += '<line x1="' + xScale(latH) + '" y1="' + yScale(jump) + '" x2="' + xScale(latH) + '" y2="' + (pad.t + plotH) + '" stroke="' + axisColor + '" stroke-width="1" stroke-dasharray="3,3"/>';
  s += '<text x="' + xScale(latH) + '" y="' + (pad.t + plotH + 18) + '" text-anchor="middle" font-size="11" fill="var(--text-primary)" font-weight="500">\u03d1<tspan baseline-shift="sub" font-size="9">H</tspan></text>';

  // labels
  s += '<text x="' + xScale(Math.max(latH * 0.35, 3)) + '" y="' + (yScale(UM(a * Math.max(latH * 0.35, 3) * Math.PI / 180)) - 10) + '" font-size="13" fill="#D85A30" font-style="italic">U_M</text>';
  s += '<text x="' + xScale(Math.min(latH + 5, latMax - 3)) + '" y="' + (yScale(UE) - 8) + '" font-size="13" fill="#378ADD" font-style="italic">U_E</text>';

  svg.innerHTML = s;
}

slider.addEventListener('input', render);
render();
</script>
